<!doctype html>
<html lang="zh-HK">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>平安包打地鼠</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="objects-v2.css"></head>
<body>
  <main id="game" class="game">
    <img class="backdrop" src="assets/festival-board.png" alt="長洲太平清醮遊戲攤位">
    <header class="hud">
      <div class="brand"><small id="brandLine">CHEUNG CHAU FESTIVAL</small><h1><i id="brandMain">平安包</i><br><span id="brandSub">打地鼠</span></h1></div>
      <div class="stats"><div><small id="timeLabel">時間</small><b id="time">30</b></div><div><small id="scoreLabel">得分</small><b id="score">0</b></div><div><small id="targetLabel">目標分數</small><b id="target">500</b></div></div>
      <button id="pause" class="pause" type="button" aria-label="暫停">Ⅱ</button>
    </header>
    <aside class="help"><b id="helpTitle">玩法說明</b><p id="helpText">拍平安包，避開蛋撻！</p><span><i id="bunLegend">平安包</i> <strong id="bunPoints">+40</strong><br><i id="tartLegend">蛋撻</i> <em id="tartPenalty">−20</em></span></aside>
    <section id="holes" class="holes" aria-label="平安包遊戲板"></section>
    <div id="mallet" class="mallet" aria-hidden="true"><i>平安</i></div>
  </main>

  <div id="startModal" class="modal"><div><small id="startEyebrow">BUN FESTIVAL CHALLENGE</small><h2 id="startTitle">平安包打地鼠</h2><p id="startText">限時內拍中平安包，取得目標分數即可過關！</p><button id="start" type="button">開始遊戲 →</button></div></div>
  <div id="pauseModal" class="modal hidden"><div><small id="pauseEyebrow">PAUSED</small><h2 id="pauseTitle">遊戲暫停</h2><button id="resume" type="button">繼續遊戲 →</button></div></div>
  <div id="finishModal" class="modal hidden"><div><small id="finishEyebrow">CHALLENGE COMPLETE</small><h2 id="finishTitle">挑戰成功！</h2><strong id="finalScore">500 分</strong><p id="finishText">平安分數已準備帶回主遊戲。</p><div class="modal-actions"><button id="retry" class="secondary" type="button">再玩一次</button><button id="returnStory" type="button">回到故事 →</button></div></div></div>
  <script src="game.js"></script>
</body>
</html>
