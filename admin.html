<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平安包打地鼠｜管理後台</title><link rel="stylesheet" href="admin.css?v=3"><link rel="stylesheet" href="admin-v3.css"></head><body><main class="shell"><header><div><small>PEACE BUN WHACK CMS</small><h1>平安包打地鼠管理後台</h1></div><button id="logout" class="ghost" hidden>登出</button></header><section id="login" class="login-card"><h2>管理員登入</h2><p>只有指定 Google Workspace 帳戶可以登入及發佈。</p><button id="loginButton">使用 Google 登入</button><p id="loginMessage" class="message"></p></section><form id="editor" hidden><div class="toolbar"><span id="userEmail"></span><div><button id="reload" type="button" class="ghost">重新載入</button><button type="submit">發佈設定</button></div></div><section><h2>共用遊戲設定</h2><div id="settingFields" class="setting-grid"></div></section><section><h2>三關設定</h2><p class="hint">速度數字越小越快；命中要求填 70 即代表 70%。</p><div id="levelFields"></div></section><section><h2>全部前台文字</h2><p class="hint"><code>{level}</code>、<code>{score}</code>、<code>{accuracy}</code> 等會自動代入資料。</p><div id="textFields" class="text-grid"></div></section><div class="publish"><span id="saveMessage" class="message"></span><button type="submit">發佈全部修改</button></div></form></main><script type="module" src="admin.js?v=3"></script></body></html>
